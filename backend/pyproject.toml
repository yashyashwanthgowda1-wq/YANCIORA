[project]
name = "redutax-backend"
version = "0.1.0"
description = "REDUTAX — Indic-Aware Token Efficiency and Evaluation Framework (backend)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "tiktoken>=0.7",
  "pyyaml>=6",
  # Pinned (team decision 2026-11-20): regex is also used by tiktoken; 2026.11.19 avoided.
  "regex==2026.9.29",
  # Runtime needs of indic-transliteration (installed separately, --no-deps; see
  # requirements-translit.txt).
  "toml==0.10.2",
  "tqdm==4.70.1",
  'colorama==0.4.6; platform_system == "Windows"',
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx>=0.27",
]
research = [
  "matplotlib>=3.8",
]
# Phase 2 adds: sentencepiece.

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["core/lexicons/*.yaml", "optimizer/phrases/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
