# Telugu linguistic review dataset (REDUTAX, schema redutax-review/v1).
# EVERY entry was drafted by an AI assistant (Claude) on 2026-11-21 and is `pending_review`:
# no Telugu speaker has checked it. See kn.yaml for how pending entries are used (protective only).
schema: redutax-review/v1
language: te
default_provenance: "Drafted by AI assistant (Claude) from general Telugu grammar knowledge, 2026-11-21; not verified by a native speaker."
entries:
