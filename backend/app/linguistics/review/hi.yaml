# Hindi linguistic review dataset (REDUTAX, schema redutax-review/v1).
# EVERY entry was drafted by an AI assistant (Claude) on 2026-11-21 and is `pending_review`:
# no Hindi speaker has checked it. See kn.yaml for how pending entries are used (protective only).
