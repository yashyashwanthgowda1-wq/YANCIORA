  - {id: kn-cond-002, category: condition, script: Knda, expression: "ಒಂದುವೇಳೆ", gloss: "in case / if by chance", match: word, detect_as: condition, canonical: "kn:in_case", note: "One-word spelling; the two-word spelling is kn-cond-006.", review: {decision: pending_review}}
  - {id: kn-cond-006, category: condition, script: Knda, expression: "ಒಂದು ವೇಳೆ", gloss: "in case / if by chance (two-word spelling)", match: phrase, detect_as: condition, canonical: "kn:in_case", review: {decision: pending_review}}
  - {id: kn-cond-003, category: condition, script: Knda, expression: "ಇಲ್ಲದಿದ್ದರೆ", gloss: "otherwise / if not", match: word, detect_as: condition, canonical: "kn:otherwise", review: {decision: pending_review}}
  - {id: kn-cond-004, category: condition, script: Knda, expression: "ತನಕ", gloss: "until", match: suffix, detect_as: condition, canonical: "kn:until", review: {decision: pending_review}}
  - {id: kn-cond-005, category: condition, script: Knda, expression: "ಹೊರತು", gloss: "unless / except", match: word, detect_as: condition, canonical: "kn:unless", review: {decision: pending_review}}

