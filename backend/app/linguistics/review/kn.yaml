# Kannada linguistic review dataset (REDUTAX, schema redutax-review/v1).
#
# EVERY entry below was drafted by an AI assistant (Claude) from general grammar knowledge on
# 2026-11-21. NONE has been checked by a Kannada speaker: all are `pending_review`.
# Reviewers: use the Linguistic Review screen (/review) or the spreadsheet export
# (docs/LINGUISTIC_REVIEW_GUIDE.md). Do not edit decisions here by hand unless you are the reviewer.
#
# How entries are used before review:
#   detection entries (negation, condition, constraint, question, entity, quantity, register,
#   romanized) — only PROTECTIVELY: text they match is never edited, and while they are pending
#   the meaning check says "review required" (at_risk) instead of "preserved" when words change.
#   rewrite entries (redundant_expression, shortening) — never applied automatically until
#   approved; aggressive mode may show them as suggestions labelled "pending review".
schema: redutax-review/v1
language: kn
default_provenance: "Drafted by AI assistant (Claude) from general Kannada grammar knowledge, 2026-11-21; not verified by a native speaker."
entries:
  # ---------- negation (mirrors backend/app/core/lexicons/negation.yaml kn-Knda / kn-Latn, plus gaps) ----------
  - {id: kn-neg-001, category: negation, script: Knda, expression: "ಇಲ್ಲ", gloss: "not / there is no", match: substring, detect_as: negation, canonical: "kn:illa", lexicon_ref: kn-Knda, review: {decision: pending_review}}
  - {id: kn-neg-002, category: negation, script: Knda, expression: "ಿಲ್ಲ", gloss: "negative verb ending (e.g. ಬರುವುದಿಲ್ಲ, will not come)", match: suffix, detect_as: negation, canonical: "kn:illa", lexicon_ref: kn-Knda, review: {decision: pending_review}}
  - {id: kn-neg-003, category: negation, script: Knda, expression: "ಬೇಡ", gloss: "do not / don't want (ಬೇಡಿ polite)", match: substring, detect_as: negation, canonical: "kn:beda", lexicon_ref: kn-Knda, review: {decision: pending_review}}
  - {id: kn-neg-004, category: negation, script: Knda, expression: "ಅಲ್ಲ", gloss: "is not (identity)", match: substring, detect_as: negation, canonical: "kn:alla", lexicon_ref: kn-Knda, review: {decision: pending_review}}
  - {id: kn-neg-005, category: negation, script: Knda, expression: "ಬಾರದು", gloss: "must not / should not (e.g. ಮಾಡಬಾರದು)", match: suffix, detect_as: negation, canonical: "kn:baaradu", note: "Gap: not in negation.yaml.", review: {decision: pending_review}}
  - {id: kn-neg-006, category: negation, script: Knda, expression: "ಬೇಡಿ", gloss: "please don't (polite form of ಬೇಡ)", match: word, detect_as: negation, canonical: "kn:beda", note: "Covered by ಬೇಡ substring; listed so a reviewer can confirm.", review: {decision: pending_review}}
  - {id: kn-neg-007, category: negation, script: Latn, expression: "illa", gloss: "Romanized ಇಲ್ಲ", match: suffix, detect_as: negation, canonical: "kn:illa", lexicon_ref: kn-Latn, review: {decision: pending_review}}
  - {id: kn-neg-008, category: negation, script: Latn, expression: "beda", gloss: "Romanized ಬೇಡ", match: word, detect_as: negation, canonical: "kn:beda", lexicon_ref: kn-Latn, review: {decision: pending_review}}
  - {id: kn-neg-009, category: negation, script: Latn, expression: "alla", gloss: "Romanized ಅಲ್ಲ", match: word, detect_as: negation, canonical: "kn:alla", lexicon_ref: kn-Latn, review: {decision: pending_review}}

