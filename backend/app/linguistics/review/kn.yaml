  - {id: kn-cons-003, category: constraint, script: Knda, expression: "ಗರಿಷ್ಠ", gloss: "at most / maximum", match: word, detect_as: constraint, canonical: "kn:at_most", review: {decision: pending_review}}
  - {id: kn-cons-004, category: constraint, script: Knda, expression: "ಕಡ್ಡಾಯ", gloss: "mandatory / compulsory", match: substring, detect_as: constraint, canonical: "kn:required", review: {decision: pending_review}}
