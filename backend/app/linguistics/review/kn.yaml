  - {id: kn-q-003, category: question, script: Knda, expression: "ಯಾವಾಗ", gloss: "when", match: word, detect_as: question, canonical: "kn:when", review: {decision: pending_review}}
  - {id: kn-q-004, category: question, script: Knda, expression: "ಎಲ್ಲಿ", gloss: "where", match: word, detect_as: question, canonical: "kn:where", review: {decision: pending_review}}
  - {id: kn-q-005, category: question, script: Knda, expression: "ಏಕೆ", gloss: "why", match: word, detect_as: question, canonical: "kn:why", review: {decision: pending_review}}
  - {id: kn-q-006, category: question, script: Knda, expression: "ಯಾಕೆ", gloss: "why (colloquial)", match: word, detect_as: question, canonical: "kn:why", review: {decision: pending_review}}
  - {id: kn-q-007, category: question, script: Knda, expression: "ಹೇಗೆ", gloss: "how", match: word, detect_as: question, canonical: "kn:how", review: {decision: pending_review}}
  - {id: kn-q-008, category: question, script: Knda, expression: "ಎಷ್ಟು", gloss: "how much / how many", match: word, detect_as: question, canonical: "kn:how_much", review: {decision: pending_review}}
