# English linguistic review dataset (REDUTAX, schema redutax-review/v1).
# Mirrors backend/app/optimizer/phrases/en.yaml (developer_curated, NOT active) so the team can
# approve or reject each entry. Drafter analysis by an AI assistant (Claude), 2026-11-21.
# The phrase list stays inactive until a team member approves entries here AND sets the list's
# review_status to `reviewed` (team decision 2026-11-20).
schema: redutax-review/v1
language: en
default_provenance: "Developer-curated English phrase list (2026-11-20); analysis drafted by AI assistant (Claude), 2026-11-21; not yet approved by the team."
entries:
  # ---------- redundant expressions from phrases/en.yaml ----------
  - {id: en-red-001, category: redundant_expression, script: Latn, expression: "in order to", gloss: "→ to", original: "in order to", proposed: "to", phrase_ref: en, preserves_meaning: "yes", changes_register: "no", safe_for_auto: true, note: "Drafter: purpose meaning kept.", review: {decision: pending_review}}
  - {id: en-red-002, category: redundant_expression, script: Latn, expression: "due to the fact that", gloss: "→ because", original: "due to the fact that", proposed: "because", phrase_ref: en, preserves_meaning: "yes", changes_register: "no", safe_for_auto: true, review: {decision: pending_review}}
  - {id: en-red-003, category: redundant_expression, script: Latn, expression: "at this point in time", gloss: "→ now", original: "at this point in time", proposed: "now", phrase_ref: en, preserves_meaning: "yes", changes_register: "no", safe_for_auto: true, review: {decision: pending_review}}
  - {id: en-red-004, category: redundant_expression, script: Latn, expression: "in the event that", gloss: "→ if (same condition: both detected as condition 'if')", original: "in the event that", proposed: "if", phrase_ref: en, preserves_meaning: "yes", changes_register: "no", safe_for_auto: true, review: {decision: pending_review}}
  - {id: en-red-005, category: redundant_expression, script: Latn, expression: "for the purpose of", gloss: "→ for", original: "for the purpose of", proposed: "for", phrase_ref: en, preserves_meaning: "yes", changes_register: "no", safe_for_auto: true, note: "Drafter: 'for' can be vaguer than 'for the purpose of'; reviewer to judge.", review: {decision: pending_review}}
  - {id: en-red-006, category: redundant_expression, script: Latn, expression: "with regard to", gloss: "→ about", original: "with regard to", proposed: "about", phrase_ref: en, preserves_meaning: "yes", changes_register: "no", safe_for_auto: true, review: {decision: pending_review}}
  - {id: en-red-007, category: redundant_expression, script: Latn, expression: "a large number of", gloss: "→ many", original: "a large number of", proposed: "many", phrase_ref: en, preserves_meaning: "yes", changes_register: "no", safe_for_auto: true, review: {decision: pending_review}}
  # ---------- politeness frames from phrases/en.yaml: register-changing ----------
  - {id: en-short-001, category: shortening, script: Latn, expression: "could you please", gloss: "→ (drop; capitalise next word)", original: "Could you please write", proposed: "Write", phrase_ref: en, preserves_meaning: "yes", changes_register: "yes", safe_for_auto: false, note: "Removes politeness: suggestion only even if approved (formality must be preserved).", review: {decision: pending_review}}
  - {id: en-short-002, category: shortening, script: Latn, expression: "can you please", gloss: "→ (drop; capitalise next word)", original: "Can you please list", proposed: "List", phrase_ref: en, preserves_meaning: "yes", changes_register: "yes", safe_for_auto: false, note: "Removes politeness: suggestion only.", review: {decision: pending_review}}
  - {id: en-short-003, category: shortening, script: Latn, expression: "i would like you to", gloss: "→ (drop; capitalise next word)", original: "I would like you to explain", proposed: "Explain", phrase_ref: en, preserves_meaning: "yes", changes_register: "yes", safe_for_auto: false, note: "Turns a polite request into a command: suggestion only.", review: {decision: pending_review}}
  - {id: en-short-004, category: shortening, script: Latn, expression: "i want you to", gloss: "→ (drop; capitalise next word)", original: "I want you to explain", proposed: "Explain", phrase_ref: en, preserves_meaning: "yes", changes_register: "yes", safe_for_auto: false, note: "Changes tone: suggestion only.", review: {decision: pending_review}}
  # ---------- register markers (detection; removal or addition makes the check ask for review) ----------
  - {id: en-reg-001, category: register, script: Latn, expression: "please", gloss: "politeness marker", match: word, detect_as: register, canonical: "en:please", review: {decision: pending_review}}
  - {id: en-reg-002, category: register, script: Latn, expression: "kindly", gloss: "politeness marker", match: word, detect_as: register, canonical: "en:please", review: {decision: pending_review}}
  # Polite-request frames (added 2026-11-21 after the English validation matrix showed "I would like you to" →
  # "Explain …" passing as 'preserved'): removing or adding one makes the check ask for review.
  - {id: en-reg-003, category: register, script: Latn, expression: "i would like you to", gloss: "polite request frame", match: phrase, detect_as: register, canonical: "en:polite_request", provenance: "Drafted by AI assistant (Claude), 2026-11-21, from the English validation matrix; not yet approved by the team.", review: {decision: pending_review}}
  - {id: en-reg-004, category: register, script: Latn, expression: "i want you to", gloss: "request frame (less formal than 'I would like you to')", match: phrase, detect_as: register, canonical: "en:want_request", provenance: "Drafted by AI assistant (Claude), 2026-11-21, from the English validation matrix; not yet approved by the team.", review: {decision: pending_review}}
  - {id: en-reg-005, category: register, script: Latn, expression: "could you", gloss: "polite request frame", match: phrase, detect_as: register, canonical: "en:could_you", provenance: "Drafted by AI assistant (Claude), 2026-11-21, from the English validation matrix; not yet approved by the team.", review: {decision: pending_review}}
  - {id: en-reg-006, category: register, script: Latn, expression: "can you", gloss: "request frame", match: phrase, detect_as: register, canonical: "en:can_you", provenance: "Drafted by AI assistant (Claude), 2026-11-21, from the English validation matrix; not yet approved by the team.", review: {decision: pending_review}}
