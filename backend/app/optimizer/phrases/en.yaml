# English verbose-phrase list for the optimizer's balanced mode (Feature 3).
#
# review_status: developer_curated — written by the developers; NOT active.
# Team decision (2026-11-20): only lists with review_status: reviewed are applied.
# To activate: a team member checks every entry, then sets review_status: reviewed and
# reviewed_by: <name, date>.
#
# Entry fields:
#   pattern            case-insensitive, whitespace-flexible, whole words
#   replacement        shorter text; capitalisation of the match's first letter is kept
#   at_sentence_start  only match at the start of a sentence (required when replacement is "")
#   capitalize_next    with an empty replacement: capitalise the next word ("Could you please write" → "Write")
# Every edit is still measured (must save tokens) and checked by the meaning gate.

id: en
language: en
review_status: developer_curated
reviewed_by: null
entries:
  - {pattern: "in order to", replacement: "to"}
  - {pattern: "due to the fact that", replacement: "because"}
  - {pattern: "at this point in time", replacement: "now"}
  - {pattern: "in the event that", replacement: "if"}
  - {pattern: "for the purpose of", replacement: "for"}
  - {pattern: "with regard to", replacement: "about"}
  - {pattern: "a large number of", replacement: "many"}
  - {pattern: "could you please", replacement: "", at_sentence_start: true, capitalize_next: true}
  - {pattern: "can you please", replacement: "", at_sentence_start: true, capitalize_next: true}
  - {pattern: "i would like you to", replacement: "", at_sentence_start: true, capitalize_next: true}
  - {pattern: "i want you to", replacement: "", at_sentence_start: true, capitalize_next: true}
