# REDUTAX dataset licence register (BRD §9.2).
#
# Nothing is imported until its entry here is complete:
#   - license and citation filled in from the source's own terms (not from memory)
#   - accessed_at set to the date the files were downloaded
#   - approved_for lists the uses the team has confirmed the licence allows
#     (evaluation, tokenizer_training, redistribution)
# "TO_VERIFY" blocks import. Every value below that says TO_VERIFY must be checked by a person.

datasets:
  # Facts below verified 2026-11-21 from the official source (see notes).
  # Approved 2026-11-21 by the Team YANCIORA project lead for INTERNAL research and evaluation
  # only, subject to CC BY-SA 4.0 attribution and share-alike obligations. Not approved for
  # redistribution or tokenizer training — do not redistribute the data or processed files
  # without re-checking the licence requirements.
  - name: FLORES-200
    version: "2022-07-14"         # flores200_dataset.tar.gz, HTTP Last-Modified 2022-07-14 (see download_url, archive_sha256)
    source_url: https://github.com/facebookresearch/flores/tree/main/flores200
    download_url: https://dl.fbaipublicfiles.com/nllb/flores200_dataset.tar.gz   # via https://tinyurl.com/flores200dataset
    archive_bytes: 25585843
    archive_sha256: b8b0b76783024b85797e5cc75064eb83fc5288b41e9654dabc7be6ae944011f6
    license: CC-BY-SA-4.0
    license_url: https://creativecommons.org/licenses/by-sa/4.0/
    license_evidence: >
      facebookresearch/flores README, "Licenses" section: "FLORES-200: CC-BY-SA 4.0"; repository
      file LICENSE_CC-BY-SA. The archive's own README has no licence statement.
    citation: >
      NLLB Team (2022). No Language Left Behind: Scaling Human-Centered Machine Translation.
      (BibTeX key nllb2022, as given in the facebookresearch/flores flores200 README.)
    accessed_at: 2026-11-21       # archive downloaded
    languages: [en, kn, hi, ta, te]
    language_codes_in_source:     # verified: files present in dev/ and devtest/ of the archive
      en: eng_Latn
      kn: kan_Knda
      hi: hin_Deva
      ta: tam_Taml
      te: tel_Telu
    approved_for: [evaluation]    # internal research/evaluation only (team decision 2026-11-21)
    approval: >
      Approved 2026-11-21 by the Team YANCIORA project lead: internal research and evaluation only;
      CC BY-SA 4.0 attribution required; share-alike applies to any shared adaptations; no
      redistribution of the dataset or processed files without verifying licence requirements.
    notes: >
      Planned use: aligned evaluation set for language comparison (Phase 1).
      FLORES has no Romanized or code-mixed text; those come from the team set.
      Licence terms (CC BY-SA 4.0): research and commercial use permitted; attribution required;
      adaptations that are shared must use the same licence (share-alike) — applies if processed
      files are redistributed. Archive check: dev 997 and devtest 1012 lines per language,
      line-aligned across en/kn/hi/ta/te. The facebookresearch/flores repository is archived
      (read-only since 2023-11-21); newer versions (FLORES+, openlanguagedata) are a different
      dataset with their own terms and are NOT covered by this entry.

  - name: REDUTAX-team-pilot
    version: "0.1"
    source_url: internal
    license: TO_VERIFY            # team decides; record consent for contributed text
    license_url: null
    citation: Team YANCIORA (No. 46), REDUTAX pilot set
    accessed_at: null
    languages: [en, kn, hi, ta, te]
    approved_for: []
    notes: >
      Human-written/verified prompts incl. Romanized and code-mixed variants.
      Follow annotation rules in research/configs/annotation_guidelines.md (to be written).
      No personal data.

  - name: REDUTAX-synthetic-prompts
    version: "v1"
    source_url: research/datasets/team_prompts/prompts_v1.jsonl
    license: TO_VERIFY            # original project text (AI-drafted); the team records its licence decision
    license_url: null
    citation: REDUTAX everyday-prompt evaluation set v1 (synthetic, AI-drafted), 2026-11-21
    accessed_at: null
    languages: [en, kn, hi, ta, te]
    approved_for: []
    notes: >
      100 synthetic prompts drafted by an AI assistant for the project (native script, Romanized,
      code-mixed, English). No third-party or user text. pending_review: not checked by native
      speakers. Not imported into the database; used only by research/scripts/run_prompt_eval.py.
