services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: redutax
      POSTGRES_PASSWORD: redutax   # local development only
      POSTGRES_DB: redutax
    ports:
      - "5432:5432"
    volumes:
      - redutax_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redutax -d redutax"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redutax_pg:
